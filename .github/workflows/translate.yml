name: "Lingo.dev Translation Automation"
on:
  push:
    branches: ["**"] # Trigger on any branch for the PR demo

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Run Flutter Bridge (Extract & Sync)
        run: node scripts/lingo-flutter.js
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

      - name: Build Flutter Web
        run: flutter build web --base-href "/${{ github.event.repository.name }}/"

      - name: Commit translated files
        run: |
          git config --global user.name "Lingo.dev Bot"
          git config --global user.email "bot@lingo.dev"
          git add lib/l10n/*.arb i18n.lock
          git diff --cached --quiet || (git commit -m "feat: auto-translate new strings (Lingo.dev)" && git push)

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
